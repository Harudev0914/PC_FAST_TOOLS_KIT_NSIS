appId: com.pcoptimizer.app
productName: PC Optimizer
directories:
  output: dist-installer
  buildResources: build
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - LICENSE
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!**/src/**/*"
  - "!**/public/**/*"
  - "!**/vite.config.js"
  - "!**/.git/**/*"
  - "!**/.vscode/**/*"
  - "!**/test*.html"
win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico  # Optional: Add icon file if available
  # 최적화 기능(Game Mode / Windows Boost / Smart Optimization)은 사용자 권한만으로 동작한다
  # — HKCU · 사용자 TEMP · powercfg만 쓴다. 하지만 Updates 패널의 드라이버 업데이트가
  # `pnputil /update-driver`를 호출하고 이건 관리자 권한이 필수라, 앱 전체는 여전히 승격이 필요하다.
  requestedExecutionLevel: requireAdministrator
  artifactName: ${productName}-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PC Optimizer
  displayLanguageSelector: true
  # installerIcon: build/icon.ico  # Optional
  # uninstallerIcon: build/icon.ico  # Optional
  # installerHeaderIcon: build/icon.ico  # Optional
  license: LICENSE
  menuCategory: Utilities
